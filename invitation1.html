<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷华先生八十大寿邀请函</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #b72424;
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-card {
            width: 90%;
            max-width: 500px;
            background: linear-gradient(135deg, #b72424 0%, #8a1a1a 100%);
            border: 4px solid #ffd700;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .invitation-card::before {
            content: "寿";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            color: rgba(255, 215, 0, 0.2);
            font-weight: bold;
            z-index: 0;
        }
        .title {
            font-size: 36px;
            color: #ffd700;
            margin: 80px 0 30px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            position: relative;
            z-index: 1;
        }
        .content {
            color: #fff;
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            color: #ffd700;
            font-size: 16px;
            position: relative;
            z-index: 1;
        }
        .decor {
            position: absolute;
            width: 100px;
            height: 60px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60"><path fill="%23ffd700" d="M0 30 Q 25 0, 50 30 T 100 30 Q 75 60, 50 30"/></svg>') no-repeat;
            background-size: contain;
        }
        .decor.left {
            top: 20px;
            left: 20px;
            transform: rotate(-15deg);
        }
        .decor.right {
            top: 20px;
            right: 20px;
            transform: rotate(15deg);
        }
        .bottom-decor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80"><path fill="%23ffd700" opacity="0.8" d="M0 0 Q 20 40, 40 0 T 80 0 Q 60 40, 100 0"/></svg>') repeat-x;
            background-size: contain;
        }
    </style>
</head>
<body>
    <div class="invitation-card">
        <div class="decor left"></div>
        <div class="decor right"></div>
        <h1 class="title">寿宴邀请函</h1>
        <div class="content">
            尊敬的长辈、亲朋好友：<br><br>
            喜逢家父八十寿辰之际<br>
            幸得身体安康，儿孙膝绕，不胜珍惜<br>
            为答谢各位亲朋好友厚爱<br>
            略备薄酒，诚挚邀请您携家人参加<br><br>
            <span class="highlight">时间：2026年2月20日（正月初四）</span><br><br>
            <span class="highlight">地址：合川大石宏盛源酒楼</span><br>
            参加我岳父雷华80寿辰宴<br><br>
               女婿廖锡勇，女儿雷利
            诚邀请各位亲朋好友前来❤️<br>
        </div>
        <div class="footer">
            恭候您的光临
        </div>
        <div class="bottom-decor"></div>
    </div>
</body>
</html>
